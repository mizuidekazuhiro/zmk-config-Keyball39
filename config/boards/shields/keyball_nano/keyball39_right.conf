# =====================
# Pointing / PMW3610
# =====================
# Current ZMK pointing API. CONFIG_ZMK_MOUSE is deprecated compatibility only.
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_SPI=y

# Keyball39 uses the external PMW3610 driver for its 3-wire/SDIO wiring.
# Disable Zephyr's native PMW3610 driver so only one driver owns the device.
CONFIG_INPUT_PMW3610=n
CONFIG_PMW3610=y

# Preserve the proven Keyball39 trackball behavior.
CONFIG_PMW3610_CPI=1200
CONFIG_PMW3610_CPI_DIVIDOR=4
CONFIG_PMW3610_ORIENTATION_180=y
CONFIG_PMW3610_SNIPE_CPI=400
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4
CONFIG_PMW3610_SCROLL_TICK=32
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_POLLING_RATE_125_SW=y
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=700
CONFIG_PMW3610_MOVEMENT_THRESHOLD=0

# =====================
# BLE buffer tuning (right/central)
# NOTE: Must satisfy CONFIG_BT_BUF_EVT_RX_COUNT > CONFIG_BT_BUF_ACL_TX_COUNT
# =====================
CONFIG_BT_BUF_ACL_TX_COUNT=5
CONFIG_BT_BUF_EVT_RX_COUNT=16

# =====================
# Central-only features
# =====================
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y
