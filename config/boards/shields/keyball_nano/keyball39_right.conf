# =====================
# Pointing / PMW3610
# =====================
# Current ZMK pointing API and the PMW3610 ALT driver.
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_SPI=y
CONFIG_PMW3610_ALT=y
# Accumulate motion and limit BLE mouse reports to avoid flooding the HID queue.
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12

# =====================
# BLE buffer tuning (right/central)
# NOTE: Must satisfy CONFIG_BT_BUF_EVT_RX_COUNT > CONFIG_BT_BUF_ACL_TX_COUNT
# =====================
CONFIG_BT_BUF_ACL_TX_COUNT=5
CONFIG_BT_BUF_EVT_RX_COUNT=16

# =====================
# Central-only features
# =====================
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y
